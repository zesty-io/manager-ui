<!DOCTYPE html>
<html lang="en">
  <head>
    <script>

    <meta charset="UTF-8" />
    <title>Zesty.io Instance Manager</title>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Zesty.io" />
    <meta name="apple-mobile-web-app-title" content="Zesty.io" />
    <meta name="theme-color" content="#171b26" />
    <meta name="msapplication-navbutton-color" content="#171b26" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="msapplication-starturl" content="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"
    />

    <link rel="manifest" href="/manifest.webmanifest" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="https://brand.zesty.io/zesty-io-logo.svg"
    />
    <link
      rel="mask-icon"
      type="image/svg+xml"
      href="https://brand.zesty.io/zesty-io-logo.svg"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto+Mono"
    />

    <style type="text/css">
      * {
        margin: 0;
        padding: 0;
        overscroll-behavior: none;
      }
      html,
      body {
        background-color: #f2f7fc;
        color: #101828;
        font-family: "Mulish", Arial, sans-serif;
        font-size: 16px;
        height: 100%;
        width: 100%;
      }

      #appBoot {
        align-items: center;
        display: flex;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        flex-direction: column;
      }

      #zestyLogo {
        margin-bottom: 32px;
      }

      #quote {
        margin-bottom: 12px;
        font-weight: 400;
        font-size: 28px;
        line-height: 36px;
        letter-spacing: -2%;
        text-align: center;
      }

      #quotee {
        font-weight: 600;
        font-size: 20px;
        line-height: 28px;
        letter-spacing: -2%;
        text-align: center;
      }

      .quote-container {
        max-width: 640px;
      }
    </style>
    <style>
      /* Media nav sidebar custom styles */
      .rv-sticky-node-list {
        margin-left: 8px;
        width: calc(100% - 8px) !important;
      }
    </style>

    <script>
      if ("serviceWorker" in navigator) {
        // FIXME: currently causing more harm than good
        // window.addEventListener("load", function() {
        //   navigator.serviceWorker.register("/sw.js");
        // });

        navigator.serviceWorker
          .getRegistrations()
          .then(function (registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
      }

      const QUOTES = [
        {
          quote: "Content is king.",
          quotee: "Bill Gates",
        },
        {
          quote:
            "Marketing is no longer about the stuff that you make, but about the stories you tell.",
          quotee: "Seth Godin",
        },
        {
          quote:
            "Your brand is a story unfolding across all customer touchpoints.",
          quotee: "Jonah Sachs",
        },
        {
          quote: "The best marketing doesn't feel like marketing.",
          quotee: "Tom Fishburne",
        },
        {
          quote: "People don't buy what you do; they buy why you do it.",
          quotee: "Simon Sinek",
        },
        {
          quote:
            "If you can't explain it simply, you don't understand it well enough.",
          quotee: "Albert Einstein",
        },
        {
          quote: "The most powerful element in advertising is the truth.",
          quotee: "Bill Bernbach",
        },
        {
          quote:
            "A brand is no longer what we tell the consumer it is—it is what consumers tell each other it is.",
          quotee: "Scott Cook",
        },
        {
          quote: "Communication works for those who work at it.",
          quotee: "John Powell",
        },
        {
          quote:
            "The single biggest problem in communication is the illusion that it has taken place.",
          quotee: "George Bernard Shaw",
        },
        {
          quote: "The art of communication is the language of leadership.",
          quotee: "James Humes",
        },
        {
          quote:
            "Engage, enlighten, encourage, and especially…just be yourself! Social media is a community effort; everyone is an asset.",
          quotee: "Susan Cooper",
        },
        {
          quote:
            "The most powerful person in the world is the storyteller. The storyteller sets the vision, values, and agenda of an entire generation that is to come.",
          quotee: "Steve Jobs",
        },
        {
          quote:
            "Your brand is what people say about you when you're not in the room.",
          quotee: "Jeff Bezos",
        },
        {
          quote: "Great stories happen to those who can tell them.",
          quotee: "Ira Glass",
        },
        {
          quote: "No matter what you do, your job is to tell a story.",
          quotee: "Gary Vaynerchuk",
        },
      ];
      const randomQuote = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    </script>

    <%= htmlWebpackPlugin.tags.headTags %>
  </head>
  <body>
    <main id="root">
      <!-- App load screen -->
      <div id="appBoot">
        <img
          id="zestyLogo"
          src="https://zestyio.media.zestyio.com/zesty-logo-only-pulsate.svg"
          alt="Displaying Zesty.io logo while application loads"
          height="100px"
          width="100px"
        />
        <div class="quote-container">
          <h3 id="quote">
            <script>
              document.write(`"${randomQuote.quote}"`);
            </script>
          </h3>
          <h5 id="quotee">
            <script>
              document.write(`— ${randomQuote.quotee}`);
            </script>
          </h5>
        </div>
      </div>
    </main>
    <!-- High z-index to beat the TinyMCE toolbar which has 1300-->
    <div id="modalMount" style="position: relative; z-index: 1301"></div>
    <%= htmlWebpackPlugin.tags.bodyTags %>
  </body>
</html>
