name: "Claude: QA"

# Two agents, one advisory comment per run. `ac` grades the PR against its linked issue from the
# code alone, in a job holding no secrets beyond the two the agent needs, since it reads public
# issue text. `browser` attacks the changed surface in the real app. `post` computes the verdict
# and comments. A red job means its half did not run; a ❌ criterion is only an annotation.

# Runs on every push: a once-per-PR report goes stale silently and a stale finding reads
# exactly like a live one. Costs ~9 min of agent time per push, serialized; advisory, so a
# queue never blocks a merge. Dispatching by hand needs the PR's branch as the ref, not just
# the pr_number input — the input only says where to comment.
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "README*"
      - "**/CHANGELOG*"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to QA"
        required: true

jobs:
  ac:
    name: Claude QA — acceptance criteria
    # Fork PRs get no secrets; pull_request (not _target) means no path to leak them.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: claude-qa-ac-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - uses: actions/checkout@v4

      # Resolve the linked issue: branch name `<issue#>-slug`, then closing refs.
      - name: Resolve Linked Issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          NUM=$(printf '%s' "$HEAD_REF" | grep -oE '(^|/)[0-9]+-' | grep -oE '[0-9]+' | head -1 || true)
          if [ -z "$NUM" ]; then
            NUM=$(gh api graphql \
              -f query='query($o:String!,$r:String!,$p:Int!){repository(owner:$o,name:$r){pullRequest(number:$p){closingIssuesReferences(first:1){nodes{number}}}}}' \
              -F o="${REPO%/*}" -F r="${REPO#*/}" -F p="$PR_NUMBER" \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[0].number // empty' 2>/dev/null || true)
          fi
          echo "issue_number=${NUM:-}" >> "$GITHUB_OUTPUT"
          echo "Linked issue: ${NUM:-<none> (change-only mode)}"

      - name: Acceptance Criteria Agent
        id: ac
        uses: anthropics/claude-code-action@1dc994ee7a008f0ecc866d9ac23ef036b7229f84 # v1.0.127
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Allow Sentry Handler auto-fix PRs (opened by github-actions[bot])
          allowed_bots: "github-actions"
          claude_args: |
            --model claude-sonnet-5
            --max-turns 50
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Write,Grep,Glob"
          prompt: |
            You are a senior QA engineer reviewing a pull request from the code only — the PR diff and
            the checked-out source. There is no running app or browser, so never claim to have observed
            runtime behavior.

            A separate "Claude: Code Review" workflow already reviews this PR for bugs, security,
            performance, and code conventions. Do not duplicate it: your only job is to judge the
            change against the linked issue's acceptance criteria. Mention a code-level problem
            only when it directly causes a criterion to fail.

            Inputs:
              REPO         = ${{ github.repository }}
              PR_NUMBER    = ${{ env.PR_NUMBER }}
              ISSUE_NUMBER = ${{ steps.issue.outputs.issue_number }}   (empty = no linked issue)
              REPORT_FILE  = ${{ github.workspace }}/qa-comment.md

            1. Establish the criteria.
               If ISSUE_NUMBER is set, read it (gh issue view <ISSUE_NUMBER> --repo <REPO>
               --json title,body,comments,labels) and derive the criteria. Where the issue states its
               acceptance criteria explicitly, take its bullets one-to-one rather than merging or
               paraphrasing them. If ISSUE_NUMBER is empty, run change-only mode: the criteria are the
               checks you judge worth performing on this change.

            2. Partition the criteria into exactly two groups, BEFORE judging any of them:
                 A. CHECKABLE — you can settle it from the diff and the source alone.
                 B. NEEDS A RUNNING APP — settling it means observing the app: rendered output,
                    timing, network behavior, anything you would have to click.
               A criterion goes in B whenever checking it honestly would mean running something. B is
               a normal, expected outcome for UI work — a report where everything landed in A is more
               suspicious than one where half did.

            3. Read the diff (gh pr diff <PR_NUMBER> --repo <REPO>) and open the changed files to
               understand what the change does. This is for your judgment only — the report does not
               include a change summary.

            4. Grade group A, and grade every one of them as exactly one of:
                 ✅ Satisfied — the code clearly implements it.
                 ❌ Not met   — the code clearly fails it (give evidence).
               There is no third mark and no "couldn't confirm" here. If you cannot settle a criterion
               from the code, it was group B and belongs there instead — do not grade it. Equally, do
               not soften a failure you can see in the diff: a missing attribute, a doc the change
               left stale, a criterion the change simply does not address is ❌.
               Group B is NOT graded. List each one with what would have to be observed to settle it,
               and never guess at its outcome.

            5. Do NOT write an overall verdict. A later step computes it from your marks. There is no
               PASS or FAIL line anywhere in the report for you to write.

            6. Suggest Cypress coverage in prose (no code): find the real spec under cypress/e2e/<area>/
               and describe the cases that would lock in the behavior.

            Write the report to REPORT_FILE with the Write tool, in exactly this shape. Keep the marker
            line verbatim and leave the "## Acceptance Criteria QA" heading exactly as written — a later step
            completes it. Do not post a comment or reply in chat.

              <!-- cv-verifier -->
              ## Acceptance Criteria QA
              <If an issue: "Validates #<n>: <title>". Else: "No linked issue found — change-only QA.">

              1. ✅ <criterion in one line>
              2. ❌ <criterion in one line> — <why it fails, one clause>

              <details>
              <summary>Not checkable from the code — needs a running app</summary>

              - <criterion> — <what would have to be observed to settle it>

              </details>

              <details>
              <summary>Suggested Cypress coverage</summary>

              <real spec file name + prose cases>
              </details>

            FORMAT RULES. A later step parses this file to compute the verdict, so these are not
            stylistic preferences:
              - The graded criteria are the ONLY numbered list in the report. Each is a single line
                beginning exactly `N. ✅ ` or `N. ❌ `, with nothing before the number.
              - Every group-B criterion is a `- ` bullet inside the "Not checkable from the code"
                details block, and appears nowhere else.
              - Never use ✅ or ❌ anywhere else in the report, and never use 🔴 or 🟡 at all.
              - Omit the "Not checkable" block if group B is empty; omit the numbered list if group A
                is empty. Never emit both empty.
              - Keep the blank lines after each <summary> and before each </details> — GitHub will not
                render the markdown inside without them.

            Rules: the report contains nothing beyond this template — no summary, no extra sections.
            The "— why" clause on a ❌ line is the only place for explanation; ✅ lines get none. In
            change-only mode the numbered list is the checks you performed. Never write `#<n>` except
            in the "Validates #<n>" line (GitHub auto-links it), and never quote the `<!-- cv-verifier -->`
            marker anywhere but the first line.

      - name: Upload AC Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-ac-report
          path: qa-comment.md
          if-no-files-found: ignore

  browser:
    name: Claude QA — browser (advisory)
    needs: ac
    if: >-
      always() && needs.ac.result != 'cancelled' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Its own group, not ci.yaml's — sharing that one meant losing the single pending slot to
    # every PR's Cypress run and being cancelled before starting. Only stops two QA agents
    # mutating the same fixtures at once; isolation from Cypress comes from the instance. Stays
    # non-cancelling now pushes trigger runs — cancelling a global group would let one PR's push
    # kill another's run.
    concurrency:
      group: manager-ui-qa
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      # INTERNAL-NEGATIVE-QA, not the Cypress instance. Fixtures are authored in production and
      # reach dev via the nightly sync, which doubles as the cleanup.
      QA_INSTANCE_ZUID: 8-acabf6a8d6-bj9tr2
      # Pinned: --storage-state is load-bearing, and a silent rename would look like the app
      # being behind a login screen rather than a bug.
      PLAYWRIGHT_MCP_VERSION: 0.0.78

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # Needs full history to diff the branch against origin/dev.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22.19.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Auth with Gcloud
        uses: google-github-actions/auth@v0
        with:
          credentials_json: ${{ secrets.GCP_DEV_SA_KEY }}

      - name: Set up Gcloud SDK
        uses: google-github-actions/setup-gcloud@v0
        with:
          project_id: zesty-dev

      # Pulls ci/.env (KMS-decrypted test credentials).
      - name: Setup Testing Environment
        run: npm run ci:test:setup

      # The app derives its ZUID from window.location.host, so localhost cannot work. Kept out
      # of ci/scripts/update_etc_hosts.sh so the Cypress suite's setup stays untouched.
      - name: Add QA Instance Hosts Entry
        run: |
          echo "127.0.0.1 ${QA_INSTANCE_ZUID}.manager.dev.zesty.io" | sudo tee -a /etc/hosts
          grep "${QA_INSTANCE_ZUID}" /etc/hosts

      # --no-save keeps it out of package-lock so other CI jobs don't pay for it. Installing
      # first makes `npx playwright install` match the exact build @playwright/mcp pins.
      - name: Install Playwright MCP and Chromium
        run: |
          npm install --no-save --legacy-peer-deps "@playwright/mcp@${PLAYWRIGHT_MCP_VERSION}"
          npx playwright install --with-deps chromium

      - name: Start Dev Server
        run: |
          npm start > devserver.log 2>&1 &
          npx wait-on -t 180000 http://localhost:8080
          echo "Dev server up."

      # Writes auth-state.json (session cookie only, so the token never enters the agent's
      # prompt) and asserts the session works. A rejected session would otherwise burn the whole
      # turn budget on a login screen and report "no findings" — same shape as a clean PR.
      - name: Establish and Verify QA Session
        run: node ci/scripts/qa_session.mjs

      # Advisory: the action exits non-zero on turn exhaustion, which is "cut short", not
      # "failed". Swallow it and report whatever was written.
      - name: Browser Agent
        id: browser
        uses: anthropics/claude-code-action@1dc994ee7a008f0ecc866d9ac23ef036b7229f84 # v1.0.127
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Allow Sentry Handler auto-fix PRs (opened by github-actions[bot])
          allowed_bots: "github-actions"
          prompt: |
            You are a senior QA engineer doing NEGATIVE testing on a pull request. The app is
            already running and your browser is already signed in — just navigate.

            Inputs:
              REPO        = ${{ github.repository }}
              PR_NUMBER   = ${{ env.PR_NUMBER }}
              BASE_URL    = http://${{ env.QA_INSTANCE_ZUID }}.manager.dev.zesty.io:8080
              REPORT_FILE = ${{ github.workspace }}/browser-qa-comment.md

            A separate job judges this PR against its issue's acceptance criteria from the
            code. Do not duplicate it: no change summary, no restating the diff, no test
            suggestions. Your job is to find inputs and sequences that break it.

            STEP 1 — Scope.
            Read the diff (gh pr diff <PR_NUMBER> --repo <REPO>) and the checked-out source.
            Map the changed files to the routes that render them; src/shell/views/Shell/Shell.tsx
            is the top-level router and src/apps/<name>/ are the sub-apps. Probe ONLY surfaces
            the diff actually touches. If the diff is docs/config/CI only, write a report that is
            the heading from STEP 5 and the single line "Nothing in this diff renders in the
            app." and stop — that is a correct outcome, not a failure.

            STEP 2 — The instance is yours.
            BASE_URL is INTERNAL-NEGATIVE-QA, an instance that exists only for this workflow.
            Everything on it is disposable fixture data. Find your way around it the way you
            would any CMS — the left nav lists the models, each model lists its items — rather
            than expecting a manifest. The models named qa_negative_* are the ones built for
            you, and they carry the full range of field types plus relationships between them.

            You may mutate ANYTHING on this instance — edit, delete, publish, unpublish, create
            new items, corrupt data deliberately. Nothing else shares it, and it is restored
            wholesale from production every night, so there is no cleanup to do and no way for
            you to break another PR. Do not hold back on destructive paths: delete-while-
            referenced, publish-then-unpublish, and unsaved-changes-then-navigate are exactly
            the sequences that break in production and that nobody tests by hand.

            The one thing to avoid is wasting turns on housekeeping. Do not restore values you
            changed and do not clean up after yourself — the nightly sync does it for you.

            STEP 3 — Attack the changed surface.
            Snapshot before each interaction. Work through, as applicable to what changed:
              - empty, whitespace-only, and maximum-length input
              - markup and script-looking strings in text fields (e.g. <b>x</b>, {{a.b}})
              - invalid characters in slugs, path parts, and names
              - rapid double-submit; clicking Save twice before the first request settles
              - Cancel, or navigating away, mid-save
              - browser Back after a mutation, and reload with unsaved changes
              - deleting or unlinking a dependency that something else is pointing at
              - switching between two selections faster than the network settles
              - the empty state and the error state of every list, picker, and dropdown
            Check mcp__playwright__browser_console_messages and browser_network_requests after
            each sequence — an uncaught exception or a 4xx/5xx nobody surfaces is a finding
            even when the UI looks fine.

            This repo's test-id attribute is data-cy, and the MCP server is configured to use
            it. If a control you need to reach has no data-cy attribute, that is itself worth
            noting in the report — CLAUDE.md requires one on every interactive element.

            STEP 4 — Evidence discipline, and your turn budget.
            A finding counts only if you REPRODUCED IT TWICE. Reset to a known state and do it
            again before you write it down. Discard anything you cannot reproduce.

            Capture evidence in this order, while the broken state is still on screen — it is
            gone once you navigate away:
              1. Reproduce the failure.
              2. Call mcp__playwright__browser_take_screenshot with an explicit `filename`
                 argument — a plain name with no directory, e.g. empty-title-saves-blank.png.
              3. Write the finding, referencing exactly that filename.
            Only reference a filename you actually passed to the tool. If a finding has no
            screenshot, write it WITHOUT a SCREENSHOT: line rather than inventing one — a later
            step verifies every reference against the files on disk and flags any that are
            missing, so an invented one makes the whole report look untrustworthy.

            You have a HARD limit of 150 turns and there is no warning before it is reached.
            Everything you have not written to REPORT_FILE when you hit it is lost, and the run
            produces nothing at all. So:
              - Write REPORT_FILE once early, as soon as you know the scope.
              - Rewrite it immediately after each confirmed finding. Never batch them up.
              - Once you have spent roughly 120 turns, stop probing, finalise the report, and
                close the browser — an accurate partial report beats an interrupted perfect one.
            You do not need to flag that you stopped early: a later step detects it and adds a
            note to the comment automatically. Just make sure what you did find is written down.

            STEP 5 — Report.
            Write REPORT_FILE with the Write tool. First line must be exactly:

              ## Adversarial Browser QA

            Then STRAIGHT INTO THE FINDINGS. Do NOT write an overview, preamble, or summary
            paragraph — no recap of what the diff changes, no description of what you attacked,
            no verdict sentence. A reviewer opens this to see what broke; anything above the
            first finding pushes that off the screen. One section each:

              ### <emoji> <one-line finding>
              **Type:** regression from this PR | pre-existing on the touched surface
              **Steps:** numbered, starting from a URL, short enough to follow verbatim
              **Expected:** … **Actual:** …
              **Console/network:** anything relevant, or "clean"
              ![<caption>](SCREENSHOT:<your-filename>.png)

            Severity emoji: 🔴 breaks the feature · 🟡 degrades it · 🔵 cosmetic. Never use ✅ or
            ❌ anywhere in the report.
            Reference screenshots ONLY as SCREENSHOT:<filename>.png — a later step rewrites
            those into real URLs. Do not invent paths or URLs for them.

            After the findings, list what you probed that behaved correctly, plus any cleanup
            you did. This matters — it is how a reviewer tells a thorough pass from a shallow
            one — but it is reference material, not the headline, so it MUST be collapsed
            inside a details block, exactly like this:

              <details>
              <summary>Also checked and working correctly</summary>

              - <thing you tried> — <what correctly happened>
              - <thing you tried> — <what correctly happened>

              </details>

            Keep the blank lines after <summary> and before </details> — GitHub will not render
            the markdown inside without them.

            If you found nothing, the report is "## Adversarial Browser QA", the single line
            "No reproducible edge-case failures found on the surfaces this PR changes.",
            and the collapsed details block. AN EMPTY REPORT IS A VALID AND COMMON OUTCOME.
            Never pad it with speculative or unreproduced findings, and never report a finding
            you did not screenshot.

            Finish by calling mcp__playwright__browser_close. Do not post any comment
            yourself — a later step does that.

          claude_args: |
            --mcp-config '{"mcpServers":{"playwright":{"command":"npx","args":["@playwright/mcp","--headless","--isolated","--no-sandbox","--storage-state","${{ github.workspace }}/auth-state.json","--output-dir","${{ github.workspace }}/qa-artifacts","--viewport-size","1920x1080","--test-id-attribute","data-cy"]}}}'
            --allowedTools "mcp__playwright__browser_navigate,mcp__playwright__browser_navigate_back,mcp__playwright__browser_snapshot,mcp__playwright__browser_find,mcp__playwright__browser_click,mcp__playwright__browser_type,mcp__playwright__browser_fill_form,mcp__playwright__browser_select_option,mcp__playwright__browser_hover,mcp__playwright__browser_drag,mcp__playwright__browser_drop,mcp__playwright__browser_press_key,mcp__playwright__browser_wait_for,mcp__playwright__browser_tabs,mcp__playwright__browser_take_screenshot,mcp__playwright__browser_console_messages,mcp__playwright__browser_network_requests,mcp__playwright__browser_evaluate,mcp__playwright__browser_resize,mcp__playwright__browser_handle_dialog,mcp__playwright__browser_close,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Read,Write,Grep,Glob"
            --model claude-sonnet-5
            --max-turns 150

      # continue-on-error also turns the step green, making a truncated run look complete.
      # Say so on the run and in the comment.
      - name: Note Incomplete Run
        if: always() && steps.browser.outcome == 'failure'
        run: |
          echo "::warning::The browser agent did not run to completion (turn limit or error). Browser coverage is partial; the AC verdict stands."
          FILE="browser-qa-comment.md"
          if [ -s "$FILE" ]; then
            # Also flag it under the heading: a footer alone is below the fold.
            sed -i '0,/^## Adversarial Browser QA/s/^## Adversarial Browser QA.*$/&\n\n> ⚠️ **Incomplete pass** — browser coverage is partial; the acceptance-criteria verdict above stands.\n/' "$FILE"
            printf '\n\n---\n_⚠️ The browser pass did not run to completion. Its findings above still stand, but its coverage is partial; the acceptance-criteria verdict is unaffected._\n' >> "$FILE"
          fi

      # Here rather than in `post`: the upload needs this job's gcloud credentials.
      - name: Publish Screenshots and Rewrite Links
        if: always()
        run: python3 ci/scripts/publish_qa_screenshots.py qa-artifacts browser-qa-comment.md

      # Durable copy: the GCS bucket is shared and periodically purged. `post` reads the report.
      - name: Upload QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: negative-qa-artifacts
          path: |
            qa-artifacts/
            browser-qa-comment.md
            devserver.log
          if-no-files-found: ignore

      # No cleanup step: the nightly sync resets the instance wholesale.

  post:
    name: Claude QA — comment
    needs: [ac, browser]
    # A cancelled `ac` means a newer push superseded this run; a skipped one is a draft or fork.
    if: always() && needs.ac.result != 'cancelled' && needs.ac.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # Either artifact is missing when its half wrote nothing; the next step says so.
      - name: Download AC Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qa-ac-report

      - name: Download Browser Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: negative-qa-artifacts
          path: browser-artifacts

      # The verdict is arithmetic on the AC agent's marks, so the same marks always give the same
      # verdict; then both sections are joined into the one comment.
      - name: Compute Verdict and Assemble Comment
        id: qa
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          set -euo pipefail
          FILE="$GITHUB_WORKSPACE/qa-comment.md"
          BROWSER="$GITHUB_WORKSPACE/browser-artifacts/browser-qa-comment.md"
          PASSED=0 FAILED=0 RUNTIME=0
          # Graded criteria are the report's only numbered list; group B are bullets inside the
          # details block. That separation is what makes both countable.
          if [ -s "$FILE" ] && grep -q '<!-- cv-verifier -->' "$FILE"; then
            PASSED=$(grep -cE '^[0-9]+\. ✅' "$FILE" || true)
            FAILED=$(grep -cE '^[0-9]+\. ❌' "$FILE" || true)
            RUNTIME=$(sed -n '/<summary>Not checkable from the code/,/<\/details>/p' "$FILE" | grep -cE '^- ' || true)
          fi
          GRADED=$((PASSED + FAILED))
          if [ "$GRADED" -eq 0 ] && [ "$RUNTIME" -eq 0 ]; then
            VERDICT=NO_REPORT
            SUMMARY="NO REPORT"
          elif [ "$FAILED" -gt 0 ]; then
            VERDICT=FAIL
            SUMMARY="❌ FAIL — ${FAILED} of ${GRADED} code-checkable criteria not met"
          elif [ "$GRADED" -eq 0 ]; then
            VERDICT=PASS
            SUMMARY="✅ PASS — nothing in this change was checkable from the code"
          else
            VERDICT=PASS
            SUMMARY="✅ PASS — ${PASSED}/${GRADED} code-checkable criteria confirmed"
          fi
          if [ "$RUNTIME" -eq 1 ]; then
            SUMMARY="${SUMMARY}, 1 needs a running app"
          elif [ "$RUNTIME" -gt 1 ]; then
            SUMMARY="${SUMMARY}, ${RUNTIME} need a running app"
          fi
          echo "Counts: passed=$PASSED failed=$FAILED runtime=$RUNTIME -> $VERDICT"
          BROWSER_OK=false
          if [ -s "$BROWSER" ] && grep -q '^## Adversarial Browser QA' "$BROWSER"; then
            BROWSER_OK=true
          fi
          if [ "$VERDICT" = NO_REPORT ] && [ "$BROWSER_OK" = false ]; then
            echo "::error::Neither agent wrote a report; no comment posted."
            exit 1
          fi
          # A marker is written only for a half that reported, so a parser keyed on it never
          # mistakes a stub for a report. Copies the agents wrote are dropped; ours are the only
          # ones. 🔴/🟡 are stripped from the AC half: the scoreboard counts them as browser findings.
          python3 - "$FILE" "$BROWSER" "$SUMMARY" "$VERDICT" "$BROWSER_OK" <<'PY'
          import io, os, sys
          path, browser, summary, verdict, browser_ok = sys.argv[1:6]
          MARKERS = ("<!-- cv-verifier", "<!-- negative-qa", "<!-- qa-verdict:")

          def body(p):
              text = io.open(p, encoding="utf-8").read().rstrip("\n")
              return [l for l in text.split("\n") if not l.startswith(MARKERS)]

          out = []
          if verdict == "NO_REPORT":
              ac = ["## Acceptance Criteria QA — NO REPORT", "",
                    "The acceptance-criteria agent wrote no criteria; see the workflow logs."]
          else:
              out.append("<!-- cv-verifier -->")
              ac = ["## Acceptance Criteria QA — " + summary
                    if l.strip().startswith("## Acceptance Criteria QA")
                    else l.replace("🔴", "").replace("🟡", "") for l in body(path)]
          if browser_ok == "true":
              out.append("<!-- negative-qa -->")
              qa = body(browser)
          elif os.environ.get("BROWSER_RESULT") == "success":
              qa = ["## Adversarial Browser QA", "", "The browser agent wrote no report; see the workflow logs."]
          else:
              qa = ["## Adversarial Browser QA", "",
                    "The browser pass did not run (job %s). See the workflow logs."
                    % (os.environ.get("BROWSER_RESULT") or "not started")]
          out += ac + [""] + qa
          out += ["", "<!-- qa-verdict: %s -->" % verdict]
          io.open(path, "w", encoding="utf-8").write("\n".join(out) + "\n")
          PY
          echo "post=true" >> "$GITHUB_OUTPUT"
          if [ "$VERDICT" = FAIL ]; then
            echo "::error::QA found an unmet criterion — see the QA comment."
          elif [ "$VERDICT" = NO_REPORT ]; then
            echo "::warning::The acceptance-criteria agent wrote no criteria; the comment says so."
          fi

      # A new comment per run, so earlier reports stay readable.
      - name: Post QA Comment
        if: steps.qa.outputs.post == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          BODY=$(cat "$GITHUB_WORKSPACE/qa-comment.md")
          PAYLOAD=$(BODY="$BODY" python3 -c 'import os,json,sys; sys.stdout.write(json.dumps({"body": os.environ["BODY"]}))')
          printf '%s' "$PAYLOAD" | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - --silent
          echo "Posted QA comment."
