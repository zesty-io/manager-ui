name: Claude Negative QA

# The dynamic counterpart to Claude Change Verifier. That workflow reviews a PR from the code
# only and answers "does this satisfy the issue?"; this one boots the real app in a real
# browser and answers "what breaks when I misuse it?". Cypress covers the happy paths, and its
# specs are written by the same person who wrote the feature — so they encode the author's
# assumptions. This job is a senior QA persona that attacks the PR's changed surface with the
# inputs nobody thought about, and reports the failures with screenshots as evidence.
#
# Advisory only: it never fails the build. Agentic browser exploration is non-deterministic,
# and a false positive blocking a merge would burn the team's trust in it within a week.

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to QA"
        required: true

# Its own repo-wide group, deliberately NOT ci.yaml's manager-ui-e2e-dev-instance.
#
# Sharing that group meant competing with every PR's Cypress suite for the single *pending*
# slot GitHub allows per concurrency group. This job is the lowest-priority thing in it, so it
# lost that race routinely — observed in practice: a queued run was cancelled before its job
# ever started because another PR's ci run claimed the slot. A QA job that silently doesn't run
# is worse than one that runs at an awkward moment.
#
# One QA agent at a time repo-wide still bounds the load this puts on the shared dev instance.
# The real protection against cross-contamination isn't the concurrency group anyway — it's
# qa_seed.mjs giving each run its own throwaway model and item, which the agent is instructed
# to mutate exclusively.
concurrency:
  group: manager-ui-negative-qa
  cancel-in-progress: false

jobs:
  negative-qa:
    # Fork PRs get neither ANTHROPIC_API_KEY nor GCP_DEV_SA_KEY; this uses pull_request
    # (not pull_request_target) so there is no path to leak them.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      BASE_URL: http://8-f48cf3a682-7fthvk.manager.dev.zesty.io:8080
      # Pinned, not @latest: the MCP server's CLI flags are load-bearing here (--storage-state
      # is how the agent gets an authenticated browser), and a silent flag rename on a floating
      # version would look like "the whole app is behind a login screen" rather than a bug.
      PLAYWRIGHT_MCP_VERSION: 0.0.78

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # Needs full history to diff the branch against origin/dev.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22.19.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Auth with Gcloud
        uses: google-github-actions/auth@v0
        with:
          credentials_json: ${{ secrets.GCP_DEV_SA_KEY }}

      - name: Set up Gcloud SDK
        uses: google-github-actions/setup-gcloud@v0
        with:
          project_id: zesty-dev

      # Pulls ci/.env (KMS-decrypted test credentials) and writes the /etc/hosts entry.
      # The app derives its instance ZUID from window.location.host, so it cannot be
      # reached at localhost — the hosts alias is load-bearing, not a convenience.
      - name: Setup Testing Environment
        run: npm run ci:test:setup

      # --no-save so this never lands in package.json/package-lock and the other CI jobs don't
      # pay for it on every `npm install`. Installing it locally first means the subsequent
      # `npx playwright install` resolves to the exact playwright build @playwright/mcp pins,
      # so the browser binaries always match the driver.
      - name: Install Playwright MCP and Chromium
        run: |
          npm install --no-save --legacy-peer-deps "@playwright/mcp@${PLAYWRIGHT_MCP_VERSION}"
          npx playwright install --with-deps chromium

      # Seeds a throwaway model + item and writes auth-state.json, a Playwright storage state
      # holding just the session cookie. The agent is handed an already-authenticated browser,
      # so the token never enters its prompt or transcript.
      - name: Seed QA Content
        run: node ci/scripts/qa_seed.mjs

      - name: Start Dev Server
        run: |
          npm start > devserver.log 2>&1 &
          npx wait-on -t 180000 http://localhost:8080
          echo "Dev server up."

      # Fail loudly here rather than letting the agent burn 80 turns discovering it can't get
      # past the login screen and then reporting "no findings" — which is indistinguishable
      # from a clean PR.
      - name: Verify Authenticated Session
        run: node ci/scripts/qa_verify_session.mjs

      # This workflow is advisory and must never fail a PR. The action exits non-zero when the
      # agent hits its turn limit, which would otherwise turn the check red for what is really
      # "the QA pass was cut short" — so swallow it and let the reporting steps run on whatever
      # the agent managed to write.
      - uses: anthropics/claude-code-action@1dc994ee7a008f0ecc866d9ac23ef036b7229f84 # v1.0.127
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are a senior QA engineer doing NEGATIVE testing on a pull request. The app is
            already running and your browser is already signed in — just navigate.

            Inputs:
              REPO        = ${{ github.repository }}
              PR_NUMBER   = ${{ env.PR_NUMBER }}
              BASE_URL    = ${{ env.BASE_URL }}
              CONTEXT     = ${{ github.workspace }}/qa-context.json
              REPORT_FILE = ${{ github.workspace }}/negative-qa-comment.md

            A separate "QA Review" workflow already validates this PR against its issue's
            acceptance criteria from the code. Do not duplicate it: no change summary, no
            restating the diff, no judging whether the PR satisfies its issue, no test
            suggestions. Your job is to find inputs and sequences that break it.

            STEP 1 — Scope.
            Read the diff (gh pr diff <PR_NUMBER> --repo <REPO>) and the checked-out source.
            Map the changed files to the routes that render them; src/shell/views/Shell/Shell.tsx
            is the top-level router and src/apps/<name>/ are the sub-apps. Probe ONLY surfaces
            the diff actually touches. If the diff is docs/config/CI only, write an empty
            report and stop — that is a correct outcome, not a failure.

            STEP 2 — Test data discipline.
            Read CONTEXT. It names a model and item seeded specifically for this run, plus the
            URL to reach them. Mutate ONLY those records. The dev instance is shared with every
            other PR's Cypress run and several specs assert on specific live records — touching
            anything else will break unrelated builds.

            STEP 3 — Attack the changed surface.
            Snapshot before each interaction. Work through, as applicable to what changed:
              - empty, whitespace-only, and maximum-length input
              - markup and script-looking strings in text fields (e.g. <b>x</b>, {{a.b}})
              - invalid characters in slugs, path parts, and names
              - rapid double-submit; clicking Save twice before the first request settles
              - Cancel, or navigating away, mid-save
              - browser Back after a mutation, and reload with unsaved changes
              - deleting or unlinking a dependency that something else is pointing at
              - switching between two selections faster than the network settles
              - the empty state and the error state of every list, picker, and dropdown
            Check mcp__playwright__browser_console_messages and browser_network_requests after
            each sequence — an uncaught exception or a 4xx/5xx nobody surfaces is a finding
            even when the UI looks fine.

            This repo's test-id attribute is data-cy, and the MCP server is configured to use
            it. If a control you need to reach has no data-cy attribute, that is itself worth
            noting in the report — CLAUDE.md requires one on every interactive element.

            STEP 4 — Evidence discipline, and your turn budget.
            A finding counts only if you REPRODUCED IT TWICE. Reset to a known state and do it
            again before you write it down. Discard anything you cannot reproduce.

            Evidence is captured by CALLING A TOOL, not by writing a filename. The order is
            strict and there is no exception:
              1. Reproduce the failure so the broken state is on screen.
              2. CALL mcp__playwright__browser_take_screenshot with an explicit `filename`
                 argument (e.g. empty-title-saves-blank.png). Do this while the state is on
                 screen — it is gone once you navigate away.
              3. Only then write the finding, referencing exactly the filename you just passed.
            A SCREENSHOT: token for a file you did not actually create is a fabricated citation:
            it makes the report look evidenced when it is not, and a later step will flag it as
            missing. If you have no screenshot for a finding, write the finding WITHOUT any
            SCREENSHOT: line rather than inventing one.

            You have a HARD limit of 80 turns and there is no warning before it is reached.
            Everything you have not written to REPORT_FILE when you hit it is lost, and the run
            produces nothing at all. So:
              - Write REPORT_FILE once early, as soon as you know the scope, even if it only
                says no findings yet.
              - Rewrite it immediately after each confirmed finding. Never batch them up.
              - Once you have spent roughly 60 turns, stop probing, finalise the report, and
                close the browser — an accurate partial report beats an interrupted perfect one.
            If you stopped early, say so in the summary line and name what you did not get to.

            STEP 5 — Report.
            Write REPORT_FILE with the Write tool. First line must be exactly:

              <!-- negative-qa -->

            Then "## Negative QA" and a one-line summary. Then one section per finding:

              ### <emoji> <one-line finding>
              **Type:** regression from this PR | pre-existing on the touched surface
              **Steps:** numbered, starting from a URL, short enough to follow verbatim
              **Expected:** … **Actual:** …
              **Console/network:** anything relevant, or "clean"
              ![<caption>](SCREENSHOT:<your-filename>.png)

            Severity emoji: 🔴 breaks the feature · 🟡 degrades it · 🔵 cosmetic.
            Reference screenshots ONLY as SCREENSHOT:<filename>.png — a later step rewrites
            those into real URLs. Do not invent paths or URLs for them.

            If you found nothing, the report is the marker line, "## Negative QA", and
            "No reproducible edge-case failures found on the surfaces this PR changes."
            AN EMPTY REPORT IS A VALID AND COMMON OUTCOME. Never pad it with speculative or
            unreproduced findings, and never report a finding you did not screenshot.

            Before you finish, REWRITE THE SUMMARY LINE so it describes the run as completed.
            The early draft you wrote mid-run will contain provisional wording like "still
            investigating" — that is correct while you are working and wrong once you stop. It
            is the first thing a reviewer reads, and left stale it makes a finished pass look
            abandoned. State what you covered and, if you ran short of turns, what you did not.

            Finish by calling mcp__playwright__browser_close. Do not post any comment
            yourself — a later step does that.

          claude_args: |
            --mcp-config '{"mcpServers":{"playwright":{"command":"npx","args":["@playwright/mcp","--headless","--isolated","--no-sandbox","--storage-state","${{ github.workspace }}/auth-state.json","--output-dir","${{ github.workspace }}/qa-artifacts","--viewport-size","1920x1080","--test-id-attribute","data-cy"]}}}'
            --allowedTools "mcp__playwright__browser_navigate,mcp__playwright__browser_navigate_back,mcp__playwright__browser_snapshot,mcp__playwright__browser_find,mcp__playwright__browser_click,mcp__playwright__browser_type,mcp__playwright__browser_fill_form,mcp__playwright__browser_select_option,mcp__playwright__browser_hover,mcp__playwright__browser_drag,mcp__playwright__browser_drop,mcp__playwright__browser_press_key,mcp__playwright__browser_wait_for,mcp__playwright__browser_tabs,mcp__playwright__browser_take_screenshot,mcp__playwright__browser_console_messages,mcp__playwright__browser_network_requests,mcp__playwright__browser_evaluate,mcp__playwright__browser_resize,mcp__playwright__browser_handle_dialog,mcp__playwright__browser_close,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Read,Write,Grep,Glob"
            --model claude-sonnet-5
            --max-turns 80

      - name: Upload Screenshots and Rewrite Links
        if: always()
        run: ./ci/scripts/upload_qa_screenshots.sh qa-artifacts negative-qa-comment.md

      # The durable copy. GCS is what makes images render inline in the comment, but that
      # bucket is shared and periodically purged, so keep the real evidence here too.
      - name: Upload QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: negative-qa-artifacts
          path: |
            qa-artifacts/
            negative-qa-comment.md
            devserver.log
          if-no-files-found: ignore

      # Upsert rather than append: unlike the code reviewer's verdict, these findings are long,
      # so a fresh comment per push would bury the PR conversation.
      - name: Post QA Findings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ env.PR_NUMBER }}
        run: |
          set -euo pipefail
          FILE="$GITHUB_WORKSPACE/negative-qa-comment.md"
          if [ ! -s "$FILE" ] || ! grep -q '<!-- negative-qa -->' "$FILE"; then
            echo "::warning::negative-qa-comment.md missing or malformed; skipping comment."
            exit 0
          fi
          BODY=$(cat "$FILE")
          PAYLOAD=$(BODY="$BODY" python3 -c 'import os,json,sys; sys.stdout.write(json.dumps({"body": os.environ["BODY"]}))')
          CID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- negative-qa -->")) | .id' | head -n1)
          if [ -n "${CID:-}" ]; then
            printf '%s' "$PAYLOAD" | gh api -X PATCH "repos/$REPO/issues/comments/$CID" --input - --silent
            echo "Updated existing negative-QA comment."
          else
            printf '%s' "$PAYLOAD" | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - --silent
            echo "Posted negative-QA comment."
          fi

      # Always runs, so a crashed or timed-out agent never leaks records onto the shared
      # dev instance. Exits 0 even on failure — cleanup must not mask the QA result.
      - name: Clean Up Seeded Content
        if: always()
        run: node ci/scripts/qa_cleanup.mjs
