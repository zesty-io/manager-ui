name: ci

on:
  pull_request:
    branches: [dev, beta, stable, master]

jobs:
  run_tests:
    runs-on: ubuntu-latest

    steps:
      # This Clean step simply checks if there's already a workflow running from the last
      # commit and cancels it if there is. This helps us save on cloud cost in the long run.
      # See https://github.com/rokroskar/workflow-run-cleanup-action for more information.
      - name: Clean
        uses: rokroskar/workflow-run-cleanup-action@v0.2.2
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        if: "github.ref != 'refs/heads/master'"
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Auth with Gcloud
        uses: google-github-actions/auth@v0
        with:
          credentials_json: ${{ secrets.GCP_DEV_SA_KEY }}
      - name: Set up Gcloud SDK
        uses: google-github-actions/setup-gcloud@v0
        with:
          project_id: zesty-dev
      - name: Delete Old Screenshots
        run: gsutil rm gs://cypress_screenshots/* || true
      - name: Set up Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22.19.0"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Setup Testing Environment
        run: npm run ci:test:setup
      - name: Run Tests
        run: npm run ci
        env:
          CYPRESS_COVERAGE: "true"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Coverage Summary
        run: npx nyc report --reporter=text-summary --reporter=text --reporter=json-summary
        if: ${{ success() }}
      - name: Coverage Comment
        uses: actions/github-script@v7
        if: ${{ success() }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const summaryPath = path.join(process.env.GITHUB_WORKSPACE, "coverage", "coverage-summary.json");
            if (!fs.existsSync(summaryPath)) {
              core.warning(`Coverage summary not found at ${summaryPath}`);
              return;
            }

            const summary = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
            const totals = summary.total || {};
            const formatPct = (metric) =>
              typeof metric?.pct === "number" ? `${metric.pct.toFixed(2)}%` : "n/a";

            const pr = context.payload.pull_request;
            if (!pr) {
              core.info("No pull request context; skipping coverage comment.");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const coverageKeys = Object.keys(summary).filter((key) => key !== "total");
            const findCoverage = (filename) => {
              if (summary[filename]) {
                return summary[filename];
              }
              const suffixMatch = coverageKeys.find((key) => key.endsWith(`/${filename}`));
              return suffixMatch ? summary[suffixMatch] : null;
            };

            const changedFiles = files
              .map((file) => file.filename)
              .filter((filename) => filename.startsWith("src/"))
              .filter((filename) => /\.(cjs|mjs|js|jsx|ts|tsx)$/.test(filename));
            const rows = changedFiles
              .map((file) => {
                const data = findCoverage(file);
                if (!data) {
                  return `| \`${file}\` | n/a | n/a | n/a | n/a |`;
                }
                return [
                  `| \`${file}\` |`,
                  formatPct(data.lines),
                  formatPct(data.statements),
                  formatPct(data.branches),
                  formatPct(data.functions),
                  "|",
                ].join(" ");
              })
              .join("\n");

            const body = [
              "<!-- coverage-report -->",
              "## Coverage Report",
              "",
              `Overall: Lines ${formatPct(totals.lines)}, Statements ${formatPct(totals.statements)}, Branches ${formatPct(totals.branches)}, Functions ${formatPct(totals.functions)}`,
              "",
              "| File | Lines | Statements | Branches | Functions |",
              "| --- | --- | --- | --- | --- |",
              rows || "| _No changed files found_ | - | - | - | - |",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.body?.includes("<!-- coverage-report -->")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
      - name: Upload Screenshots
        if: ${{ failure() }}
        run: ./ci/scripts/upload_debug_screenshots_to_gcp.sh
