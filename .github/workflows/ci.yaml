name: ci

on:
  pull_request:
    branches: [dev, beta, stable, master]

# Serialize ALL e2e CI across PRs. Every PR's tests run against the SAME shared
# dev instance, and concurrent runs overload it (intermittent 502s / slow
# windows) — the dominant source of flakiness. A constant group (not per-ref)
# means only one CI run touches the instance at a time; every run executes under
# the same isolated, low-load conditions, which is what makes results consistent.
#
# cancel-in-progress: false — the active run finishes; newer runs wait rather
# than killing it mid-flight (a half-run leaves partial data on the instance).
#
# Trade-off: GitHub keeps at most 1 in-progress + 1 pending run per group, so if
# several PRs stack up, an older *pending* (not-yet-started) run can be superseded
# and must be re-triggered. We accept slower throughput for consistency. The setup
# "Clean" step still cancels stale same-ref runs so the lock frees faster.
concurrency:
  group: manager-ui-e2e-dev-instance
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      # This Clean step simply checks if there's already a workflow running from the last
      # commit and cancels it if there is. This helps us save on cloud cost in the long run.
      # See https://github.com/rokroskar/workflow-run-cleanup-action for more information.
      - name: Clean
        uses: rokroskar/workflow-run-cleanup-action@v0.2.2
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        if: "github.ref != 'refs/heads/master'"
      - name: Auth with Gcloud
        uses: google-github-actions/auth@v0
        with:
          credentials_json: ${{ secrets.GCP_DEV_SA_KEY }}
      - name: Set up Gcloud SDK
        uses: google-github-actions/setup-gcloud@v0
        with:
          project_id: zesty-dev
      - name: Delete Old Screenshots
        run: gsutil rm gs://cypress_screenshots/* || true

  # Runs 5 parallel jobs. Runners 0-3 split the non-global specs evenly (SPLIT=4).
  # Runner 4 is dedicated to global-state specs (publish/labels/redirects) to
  # avoid cross-runner interference. Cross-PR contention — the dominant flakiness
  # source — is handled by the workflow-level concurrency gate above (one run on
  # the shared instance at a time), so a single run's parallelism is safe.
  # cypress-split distributes specs based on SPLIT and SPLIT_INDEX.
  # Repo: https://github.com/bahmutov/cypress-split
  run_tests:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Don't cancel other runners if one fails
      matrix:
        split_index: [0, 1, 2, 3, 4]

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22.19.0"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Auth with Gcloud
        uses: google-github-actions/auth@v0
        with:
          credentials_json: ${{ secrets.GCP_DEV_SA_KEY }}
      - name: Set up Gcloud SDK
        uses: google-github-actions/setup-gcloud@v0
        with:
          project_id: zesty-dev
      - name: Setup Testing Environment
        run: npm run ci:test:setup
      - name: Run Tests
        if: matrix.split_index != 4
        run: npm run ci
        env:
          CYPRESS_COVERAGE: "true"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SPLIT: 4
          SPLIT_INDEX: ${{ matrix.split_index }}
          SPLIT_FILE: timings.json
          SKIP_SPEC: "cypress/e2e/content/actions.spec.js,cypress/e2e/content/list.spec.js,cypress/e2e/content/redirects.spec.js,cypress/e2e/content/workflows.spec.js,cypress/e2e/settings/workflows.spec.js,cypress/e2e/seo/redirects/redirects.spec.js"
      # Runner 4 runs all global-state specs together so that workflows.spec.js
      # (which creates a publish-blocking workflow label) and the publish/redirect
      # specs run sequentially on the same runner, avoiding cross-runner interference.
      - name: Run Tests
        if: matrix.split_index == 4
        run: npm run ci
        env:
          CYPRESS_COVERAGE: "true"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SPLIT: 1
          SPLIT_INDEX: 0
          SPEC: "cypress/e2e/content/actions.spec.js,cypress/e2e/content/list.spec.js,cypress/e2e/content/redirects.spec.js,cypress/e2e/content/workflows.spec.js,cypress/e2e/settings/workflows.spec.js,cypress/e2e/seo/redirects/redirects.spec.js"
      # Rename so artifacts from each runner have unique filenames and don't overwrite each other.
      - name: Rename Coverage Output
        if: ${{ success() }}
        run: |
          if [ -f .nyc_output/out.json ]; then
            mv .nyc_output/out.json .nyc_output/out-${{ matrix.split_index }}.json
          fi
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: coverage-${{ matrix.split_index }}
          path: .nyc_output/out-${{ matrix.split_index }}.json
      # Upload partial timings so merge_timings can combine them into a single file.
      # if-no-files-found: ignore handles the case where no timings were recorded (e.g. all specs failed).
      - name: Upload Timings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-partial-${{ matrix.split_index }}
          path: timings.json
          if-no-files-found: ignore
      - name: Upload Screenshots
        if: ${{ failure() }}
        run: ./ci/scripts/upload_debug_screenshots_to_gcp.sh
      # Backend-attribution markers recorded by cypress/support/e2e.js (one per
      # failed test that coincided with a 5xx or timeout). Uploaded per runner so
      # the backend_health job can tell whether a red run was backend-caused.
      - name: Rename Backend Markers
        if: always()
        run: |
          if [ -f results/backend-5xx.jsonl ]; then
            mkdir -p backend-markers
            cp results/backend-5xx.jsonl backend-markers/backend-5xx-${{ matrix.split_index }}.jsonl
          fi
      - name: Upload Backend Markers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-markers-${{ matrix.split_index }}
          path: backend-markers/
          if-no-files-found: ignore

  # Aggregates all matrix runner results into a single status check.
  # Branch protection should require this job, not run_tests, because matrix jobs
  # produce individual checks (run_tests (0), run_tests (1), …) — never a single run_tests check.
  all_tests_passed:
    needs: run_tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check matrix results
        run: |
          if [ "${{ needs.run_tests.result }}" != "success" ]; then
            echo "One or more test runners failed or were cancelled"
            exit 1
          fi

  # When CI fails, attribute it. If failures coincided with backend 5xx/timeouts
  # (markers recorded by cypress/support/e2e.js), post a banner telling the team
  # to escalate to the backend team and re-run, instead of triaging these as test
  # bugs. Stays silent if no backend errors were seen (then it's a real failure).
  backend_health:
    needs: run_tests
    runs-on: ubuntu-latest
    if: ${{ always() && needs.run_tests.result != 'success' }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22.19.0"
      - name: Download Backend Markers
        uses: actions/download-artifact@v4
        with:
          pattern: backend-markers-*
          path: backend-markers
          merge-multiple: true
      - name: Build Backend-Health Banner
        run: |
          node ci/scripts/backend_health.js backend-markers > backend-health.md || true
          if [ -s backend-health.md ]; then
            cat backend-health.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ No backend-attributed failures — this CI failure looks like a real test/app issue, not backend instability." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Comment Backend-Health on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            if (!fs.existsSync("backend-health.md") || fs.statSync("backend-health.md").size === 0) {
              core.info("No backend-attributed failures; skipping comment.");
              return;
            }
            const body = fs.readFileSync("backend-health.md", "utf8");
            const pr = context.payload.pull_request;
            if (!pr) return;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes("<!-- backend-health -->"));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

  # Merges partial timings.json from each runner into a single file and uploads it as an artifact.
  # Download the artifact after CI runs and commit timings.json to the repo to enable
  # runtime-based spec distribution on subsequent runs.
  merge_timings:
    needs: run_tests
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22.19.0"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      # Each artifact is downloaded into its own subdirectory: partials/timings-partial-N/timings.json
      # cypress-split-merge looks for timings.json in each subdirectory of --parent-folder.
      - name: Download Timings Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: timings-partial-*
          path: partials
      - name: Merge Timings
        run: npx cypress-split-merge --parent-folder partials --split-file timings.json --output timings.json
      - name: Upload Merged Timings
        uses: actions/upload-artifact@v4
        with:
          name: merged-timings
          path: timings.json
          if-no-files-found: ignore

  # Merges coverage output from all 4 runners and posts a single comment on the PR.
  # nyc report reads all out-N.json files in .nyc_output/ and merges them automatically.
  coverage:
    needs: run_tests
    runs-on: ubuntu-latest
    if: ${{ success() }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22.19.0"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Download Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: .nyc_output
          merge-multiple: true
      - name: Coverage Summary
        run: npx nyc report --reporter=text-summary --reporter=text --reporter=json-summary
      - name: Coverage Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const summaryPath = path.join(process.env.GITHUB_WORKSPACE, "coverage", "coverage-summary.json");
            if (!fs.existsSync(summaryPath)) {
              core.warning(`Coverage summary not found at ${summaryPath}`);
              return;
            }

            const summary = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
            const totals = summary.total || {};
            const formatPct = (metric) =>
              typeof metric?.pct === "number" ? `${metric.pct.toFixed(2)}%` : "n/a";

            const pr = context.payload.pull_request;
            if (!pr) {
              core.info("No pull request context; skipping coverage comment.");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const coverageKeys = Object.keys(summary).filter((key) => key !== "total");
            const findCoverage = (filename) => {
              if (summary[filename]) {
                return summary[filename];
              }
              const suffixMatch = coverageKeys.find((key) => key.endsWith(`/${filename}`));
              return suffixMatch ? summary[suffixMatch] : null;
            };

            const changedFiles = files
              .map((file) => file.filename)
              .filter((filename) => filename.startsWith("src/"))
              .filter((filename) => /\.(cjs|mjs|js|jsx|ts|tsx)$/.test(filename));
            const rows = changedFiles
              .map((file) => {
                const data = findCoverage(file);
                if (!data) {
                  return `| \`${file}\` | n/a | n/a | n/a | n/a |`;
                }
                return `| \`${file}\` | ${formatPct(data.lines)} | ${formatPct(
                  data.statements
                )} | ${formatPct(data.branches)} | ${formatPct(
                  data.functions
                )} |`;
              })
              .join("\n");

            const body = [
              "<!-- coverage-report -->",
              "## Coverage Report",
              "",
              "### Overall Coverage",
              "| Lines | Statements | Branches | Functions |",
              "| --- | --- | --- | --- |",
              `| ${formatPct(totals.lines)} | ${formatPct(
                totals.statements
              )} | ${formatPct(totals.branches)} | ${formatPct(
                totals.functions
              )} |`,
              "",
              "### Changed Files Coverage",
              "| File | Lines | Statements | Branches | Functions |",
              "| --- | --- | --- | --- | --- |",
              rows || "| _No changed files found_ | - | - | - | - |",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.body?.includes("<!-- coverage-report -->")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
