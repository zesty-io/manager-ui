name: "Claude: Code Review"

# Code-level review on every non-draft PR into dev: bugs, security, performance, and CLAUDE.md
# "Review red flags" only. The "Claude: QA" workflow owns "what does this change do" and
# acceptance-criteria QA — this workflow must never duplicate that. The agent only writes its
# findings to a file; later steps post each one as an inline comment and a fresh single-line
# verdict comment (deliberately NOT updated in place) so the PR timeline shows the review
# history: "1 blocker" → fix commits → "no blockers".
#
# The review prompt lives in .claude/skills/review-code/prompt.md, shared with the local
# /review-code skill. Change what the reviewer looks for there; the report shape it must
# keep is parsed by ci/scripts/post_inline_comments.js and ci/scripts/code_review_verdict.js.

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    name: Claude Code Review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@1dc994ee7a008f0ecc866d9ac23ef036b7229f84 # v1.0.127
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The Sentry Handler workflow opens auto-fix PRs as github-actions[bot] (the default
          # GITHUB_TOKEN identity) — without this, claude-code-action's human-actor check
          # rejects the run outright before it ever reads the diff.
          allowed_bots: "github-actions"
          prompt: |
            Inputs:
              REPO         = ${{ github.repository }}
              PR_NUMBER    = ${{ github.event.pull_request.number }}
              DIFF_COMMAND = gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }}
              REPORT_FILE  = ${{ github.workspace }}/review-comment.md

            Read .claude/skills/review-code/prompt.md and follow it exactly.

          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Read,Write,Grep,Glob"
            --model claude-sonnet-5
            --max-turns 100

      # The Files API (not `gh pr diff`) also carries each file's hunks, which the next step
      # uses to tell which lines a comment can anchor to.
      - name: Collect PR files
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api "repos/$REPO/pulls/$PR/files" --paginate > pr_files.json

      # Deterministic instead of relying on Claude to reliably call an inline-comment tool
      # itself. Findings GitHub can't anchor are written to unplaced.md for the verdict comment.
      # A crash here fails the job: findings that never got posted must not look like a clean run.
      - name: Post inline comments
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -s review-comment.md ]; then
            echo "::warning::review-comment.md missing; no inline comments to post."
            exit 0
          fi
          node ci/scripts/post_inline_comments.js \
            --report review-comment.md \
            --section "### Findings" \
            --pr-files pr_files.json \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --commit "${{ github.event.pull_request.head.sha }}" \
            --label "Code Review" \
            --unplaced-out unplaced.md

      # Always post a NEW verdict comment (never update in place): each push's verdict lands in
      # the PR timeline between the commits it reviewed, preserving the review history. The
      # verdict is counted from the findings, not written by the agent.
      - name: Post review verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -s review-comment.md ] || ! node ci/scripts/code_review_verdict.js review-comment.md --unplaced unplaced.md > verdict.md; then
            echo "::warning::review-comment.md missing or malformed; skipping verdict comment."
            exit 0
          fi
          BODY=$(cat verdict.md)
          PAYLOAD=$(BODY="$BODY" python3 -c 'import os,json,sys; sys.stdout.write(json.dumps({"body": os.environ["BODY"]}))')
          printf '%s' "$PAYLOAD" | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - --silent
          echo "Posted review verdict comment."
