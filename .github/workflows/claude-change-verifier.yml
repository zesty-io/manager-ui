name: Claude Change Verifier

# Complements claude-auto-reviewer.yml. Acts as a senior QA by STATIC review: it resolves the
# GitHub issue the PR addresses (branch `<issue#>-slug` or `Closes #N`), reads the PR diff and the
# changed source, and judges the change against the issue's acceptance criteria FROM THE CODE — then
# posts ONE QA sign-off comment (per-criterion results, what the change does, gaps, and prose Cypress
# automation suggestions). On later pushes it UPDATES that same comment in place rather than piling
# on new ones.
#
# It does NOT boot the app, authenticate, or drive a browser. Because it never observes the running
# app, the strongest verdict a criterion gets is "the code satisfies it"; anything it can't determine
# from the code is INCONCLUSIVE, which always stays green so uncertainty never blocks a PR. The check
# fails (red) ONLY when a criterion is clearly unmet in the code or a hard regression is evident.
#
# Fork PRs are skipped by the job-level `if:` — they don't receive ANTHROPIC_API_KEY, and this uses
# `pull_request` (NOT `pull_request_target`) so fork code never sees secrets. Don't relax that guard.

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "README*"
      - "**/CHANGELOG*"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"

jobs:
  verify:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: claude-verify-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read # the agent calls `gh issue view` on the linked issue
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      # Resolve the GitHub issue this PR addresses: branch name `<issue#>-slug` first, then GitHub's
      # native closing references, then a body grep. Empty => the QA runs in change-only mode.
      - name: Resolve linked issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -uo pipefail
          NUM=""
          if printf '%s' "$HEAD_REF" | grep -qE '(^|/)[0-9]+-'; then
            NUM=$(printf '%s' "$HEAD_REF" | grep -oE '(^|/)[0-9]+-' | grep -oE '[0-9]+' | head -1)
          fi
          if [ -z "$NUM" ]; then
            NUM=$(gh api graphql \
              -f query='query($o:String!,$r:String!,$p:Int!){repository(owner:$o,name:$r){pullRequest(number:$p){closingIssuesReferences(first:1){nodes{number}}}}}' \
              -F o="${REPO%/*}" -F r="${REPO#*/}" -F p="$PR" \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[0].number // empty' 2>/dev/null || true)
          fi
          if [ -z "$NUM" ]; then
            NUM=$(gh pr view "$PR" --repo "$REPO" --json body --jq '.body' 2>/dev/null \
              | grep -oiE '(clos|fix|resolv)[a-z]*:?[[:space:]]+#[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          fi
          echo "issue_number=${NUM:-}" >> "$GITHUB_OUTPUT"
          echo "Linked issue: ${NUM:-<none> (change-only mode)}"

      - uses: anthropics/claude-code-action@1dc994ee7a008f0ecc866d9ac23ef036b7229f84 # v1.0.127
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Static QA needs only read + report tools — no browser, no dev server. `--model` /
          # `--max-turns` go in claude_args (the action ignores them as top-level `with:` keys).
          claude_args: |
            --model claude-opus-4-7-1m
            --max-turns 50
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Write,Grep,Glob"
          prompt: |
            You are a senior QA engineer signing off on a pull request by STATIC review — reading the
            PR diff and the checked-out source ONLY. There is no running app, login, or browser, so
            never claim to have "observed" runtime behavior.

            Inputs:
              REPO         = ${{ github.repository }}
              PR_NUMBER    = ${{ github.event.pull_request.number }}
              ISSUE_NUMBER = ${{ steps.issue.outputs.issue_number }}   (empty = no linked issue)
              REPORT_FILE  = ${{ github.workspace }}/qa-comment.md

            Steps:
            1. If ISSUE_NUMBER is set, read it:
               gh issue view <ISSUE_NUMBER> --repo <REPO> --json title,body,comments,labels
               Derive a SHORT numbered list of testable acceptance criteria. If ISSUE_NUMBER is
               empty, run CHANGE-ONLY mode: there are no criteria — assess whether the change itself
               is correct.
            2. Read the diff: gh pr diff <PR_NUMBER> --repo <REPO>. Open the changed files with
               Read/Grep/Glob and summarize in plain language what the change does.
            3. Judge each acceptance criterion FROM THE CODE as exactly one of:
                 ✅ Satisfied    — the code clearly implements it (say why).
                 ⚠️ Inconclusive — you can't determine it from the code alone (say why). NOT a failure.
                 ❌ Not met      — the code clearly fails it (give the evidence).
               Never guess. When unsure between ⚠️ and ❌, choose ⚠️.
            4. Overall verdict:
                 FAIL         — at least one criterion is ❌, OR the diff shows a clear bug/regression.
                 INCONCLUSIVE — nothing clearly failing but you couldn't confirm the criteria.
                 PASS         — criteria satisfied (or, in change-only mode, the change looks correct)
                                with nothing failing.
               A FALSE FAIL blocks a good PR and is the worst outcome — never FAIL on uncertainty.
            5. Suggest Cypress coverage in PROSE (no code): glob cypress/e2e/<area>/ for the real spec
               file for this area and describe the cases that would lock in the behavior.

            Write the report to REPORT_FILE using the Write tool, in EXACTLY this structure — include
            both HTML markers verbatim (the workflow uses them to find the comment and read the
            verdict). Do NOT post a comment yourself and do NOT return the report as a chat message.

              <!-- cv-verifier -->
              ## QA Review — <PASS | FAIL | INCONCLUSIVE>
              <If an issue: "Validates #<n>: <title>". Else: "No linked issue found — change-only QA.">

              ### Acceptance criteria
              <numbered list; each line starts with ✅ / ⚠️ / ❌ and what the code shows. In
               change-only mode, list what you checked about the change instead.>

              ### What this change does
              <plain-language summary>

              ### Gaps & concerns
              <unmet criteria, missing edge cases, regression risk — or "None observed">

              ### Suggested Cypress coverage
              <real spec file name + prose cases>

              <!-- qa-verdict: <PASS_OR_FAIL_OR_INCONCLUSIVE> -->

            Replace <PASS_OR_FAIL_OR_INCONCLUSIVE> with your one-word verdict. Use plain ordered lists
            (1., 2., 3.) for the criteria and refer to them as "criterion 1" etc. — never write `#1`,
            which GitHub would auto-link to an unrelated issue. The only `#<n>` allowed is the
            "Validates #<n>" header pointing at the actual ticket.

      # Post the agent's report (qa-comment.md) or UPDATE the existing QA comment in place (found by
      # the cv-verifier marker) so repeated pushes don't pile up comments. Also reads the verdict.
      - name: Post or update QA comment
        id: qa
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          FILE="$GITHUB_WORKSPACE/qa-comment.md"
          # No usable report (missing, empty, or not our report) => infrastructure failure; gate red.
          if [ ! -s "$FILE" ] || ! grep -q '<!-- cv-verifier -->' "$FILE"; then
            echo "::warning::qa-comment.md missing or malformed; the QA gate will fail."
            echo "no_report=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BODY=$(cat "$FILE")
          VERDICT=$(printf '%s' "$BODY" | grep -oiE '<!-- qa-verdict:[[:space:]]*(PASS|FAIL|INCONCLUSIVE)[[:space:]]*-->' \
            | grep -oiE '(PASS|FAIL|INCONCLUSIVE)' | head -n1 | tr '[:lower:]' '[:upper:]' || true)

          # python escapes the multi-line body safely for the JSON request.
          PAYLOAD=$(BODY="$BODY" python3 -c 'import os,json,sys; sys.stdout.write(json.dumps({"body": os.environ["BODY"]}))')

          # Upsert our own comment: filter on the bot author + the marker as line 1 (startswith, so
          # the sibling auto-reviewer quoting the marker mid-body can't be mistaken for ours).
          CID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- cv-verifier -->")) | .id' | head -n1)
          if [ -n "${CID:-}" ]; then
            printf '%s' "$PAYLOAD" | gh api -X PATCH "repos/$REPO/issues/comments/$CID" --input - --silent
            echo "Updated existing QA comment $CID."
          else
            printf '%s' "$PAYLOAD" | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - --silent
            echo "Created QA comment."
          fi
          echo "verdict=${VERDICT:-}" >> "$GITHUB_OUTPUT"

      - name: Show QA report on failure
        if: failure()
        run: |
          if [ -f "$GITHUB_WORKSPACE/qa-comment.md" ]; then
            echo "::group::qa-comment.md"
            cat "$GITHUB_WORKSPACE/qa-comment.md"
            echo "::endgroup::"
          else
            echo "(no qa-comment.md was produced)"
          fi

      # Gate: red when the agent's verdict is FAIL, or it never produced a report (infra failure).
      # INCONCLUSIVE / empty-verdict stay green so uncertainty doesn't block. To actually block
      # merges, add this check to branch protection.
      - name: QA gate
        if: always()
        run: |
          V="${{ steps.qa.outputs.verdict }}"
          NO_REPORT="${{ steps.qa.outputs.no_report }}"
          echo "QA verdict: ${V:-<none>} (no_report=${NO_REPORT:-false})"
          if [ "$NO_REPORT" = "true" ]; then
            echo "::error::Verifier infrastructure failure — no QA report was produced. Check the workflow logs."
            exit 1
          fi
          if [ "$V" = "FAIL" ]; then
            echo "::error::QA found an unmet acceptance criterion or a hard regression — see the QA Review comment."
            exit 1
          fi
