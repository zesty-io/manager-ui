name: Lint

on:
  pull_request:
    branches: [dev, beta, stable, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: npm install --legacy-peer-deps
      - run: npm run lint
